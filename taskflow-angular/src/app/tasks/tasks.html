<h1>
  Tasks
</h1>

@if (isLoading()) {
  <p>
    Loading tasks...
  </p>
}

@if (errorMessage()) {
  <p>
    {{ errorMessage() }}
  </p>
}

@if (
  !isLoading() &&
  !errorMessage() &&
  tasks().length === 0
) {
  <p>
    No tasks found.
  </p>
}

@if (!isLoading() && !errorMessage()) {
  @for (task of tasks(); track task._id) {
    <app-task-card [task]="task" />
  }
}
