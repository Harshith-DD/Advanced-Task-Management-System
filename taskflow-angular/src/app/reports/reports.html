<section class="route-view">
  <div class="page-heading"><div><p class="eyebrow">Exports</p><h2>Reports</h2><p>Export your tasks or generate a background report.</p></div></div>
  <section class="panel">
    <div class="report-actions"><div><h3>Export tasks</h3><p>Download task data.</p></div>
      <div class="button-row"><button type="button" class="button-secondary" [disabled]="busy()" (click)="export('json')">Export JSON</button>
      <button type="button" class="button-secondary" [disabled]="busy()" (click)="export('csv')">Export CSV</button></div></div>
    <div class="report-actions"><div><h3>Generate report</h3><p>Create a background report.</p></div>
      <div class="button-row"><button type="button" [disabled]="busy()" (click)="generate()">Generate Report</button><span>{{status()}}</span></div></div>
    @if(error()){<p class="error">{{error()}}</p>}
  </section>
</section>
