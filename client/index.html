<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
        name="description"
        content="TaskFlow task management dashboard"
    >
    <title>TaskFlow</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="app-header">
<section
    class="auth-section container"
    aria-labelledby="auth-heading"
>
    <div class="auth-header">
        <h2 id="auth-heading">Account</h2>

        <p id="auth-status">
            You are not logged in.
        </p>
    </div>


    <!-- Login Form -->
    <div id="login-container">
        <h3>Login</h3>

        <form id="login-form" novalidate>

            <div class="form-group">
                <label for="login-email">
                    Email
                </label>

                <input
                    id="login-email"
                    name="email"
                    type="email"
                    autocomplete="email"
                    required
                >
            </div>


            <div class="form-group">
                <label for="login-password">
                    Password
                </label>

                <input
                    id="login-password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    required
                >
            </div>


            <button type="submit">
                Login
            </button>

            <p
                id="login-error"
                class="form-error"
                aria-live="polite"
            ></p>

        </form>
    </div>


    <!-- Register Form -->
    <div id="register-container">
        <h3>Register</h3>

        <form id="register-form" novalidate>

            <div class="form-group">
                <label for="register-name">
                    Name
                </label>

                <input
                    id="register-name"
                    name="name"
                    type="text"
                    autocomplete="name"
                    maxlength="100"
                    required
                >
            </div>


            <div class="form-group">
                <label for="register-email">
                    Email
                </label>

                <input
                    id="register-email"
                    name="email"
                    type="email"
                    autocomplete="email"
                    required
                >
            </div>


            <div class="form-group">
                <label for="register-password">
                    Password
                </label>

                <input
                    id="register-password"
                    name="password"
                    type="password"
                    autocomplete="new-password"
                    required
                >
            </div>


            <button type="submit">
                Register
            </button>

            <p
                id="register-error"
                class="form-error"
                aria-live="polite"
            ></p>

        </form>
    </div>


    <!-- Logged-in user -->
    <div
        id="user-container"
        hidden
    >
        <p id="user-info"></p>

        <button
            id="logout-button"
            type="button"
        >
            Logout
        </button>
    </div>

</section>

        <div class="container">
            <h1>TaskFlow</h1>
            <p>Mini Task Management Dashboard</p>
        </div>
    </header>

    <main class="container">

        <!-- Dashboard -->
        <section
            class="dashboard"
            aria-labelledby="dashboard-heading"
        >
            <div class="section-header">
                <h2 id="dashboard-heading">Dashboard</h2>
            </div>

            <div
                class="stats"
                aria-label="Task Statistics"
            >
                <article class="stat-card">
                    <span class="stat-label">Total</span>
                    <strong id="total-count">0</strong>
                </article>

                <article class="stat-card">
                    <span class="stat-label">Completed</span>
                    <strong id="completed-count">0</strong>
                </article>

                <article class="stat-card">
                    <span class="stat-label">Pending</span>
                    <strong id="pending-count">0</strong>
                </article>
            </div>
        </section>


        <!-- Task Controls -->
        <section
            class="task-controls"
            aria-labelledby="controls-heading"
        >
            <h2 id="controls-heading">Tasks</h2>

            <div class="controls-section">

                <div class="control-header">
                </div>
<div class="controls">

    <div class="control-group">
        <label for="search-input">
            Search Tasks:
        </label>

        <input
            id="search-input"
            type="search"
            placeholder="Search by title or description"
            autocomplete="off"
        >
    </div>


    <div class="control-group">
        <label for="status-filter">
            Status:
        </label>

        <select id="status-filter">
            <option value="all">All</option>

            <option value="completed">
                Completed
            </option>

            <option value="in-progress">
                In Progress
            </option>

            <option value="pending">
                Pending
            </option>
        </select>
    </div>


    <div class="control-group">
        <label for="priority-filter">
            Priority:
        </label>

        <select id="priority-filter">
            <option value="all">All</option>

            <option value="high">
                High
            </option>

            <option value="medium">
                Medium
            </option>

            <option value="low">
                Low
            </option>
        </select>
    </div>


    <div class="control-group">
        <label for="tag-filter">
            Tag:
        </label>

        <input
            id="tag-filter"
            type="text"
            placeholder="e.g. backend"
            autocomplete="off"
        >
    </div>


    <div class="control-group">
        <label for="from-date-filter">
            From Date:
        </label>

        <input
            id="from-date-filter"
            type="date"
        >
    </div>


    <div class="control-group">
        <label for="to-date-filter">
            To Date:
        </label>

        <input
            id="to-date-filter"
            type="date"
        >
    </div>


    <div class="control-group">
        <label for="sort-by">
            Sort By:
        </label>

        <select id="sort-by">
            <option value="createdAt">
                Created Date
            </option>

            <option value="updatedAt">
                Updated Date
            </option>

            <option value="dueDate">
                Due Date
            </option>

            <option value="priority">
                Priority
            </option>
        </select>
    </div>


    <div class="control-group">
        <label for="sort-order">
            Sort Order:
        </label>

        <select id="sort-order">
            <option value="asc">
                Ascending
            </option>

            <option value="desc">
                Descending
            </option>
        </select>
    </div>

</div>

            </div>
        </section>


        <!-- Add Task Form -->
        <section
            class="task-form-section"
            aria-labelledby="form-heading"
        >
            <h2 id="form-heading">Add New Task</h2>

            <form
                id="task-form"
                novalidate
            >

                <div class="form-group">
                    <label for="task-title">
                        Title
                    </label>

                    <input
                        id="task-title"
                        name="title"
                        type="text"
                        maxlength="100"
                        required
                    >

                    <p
                        id="title-error"
                        class="field-error"
                        aria-live="polite"
                    ></p>
                </div>


                <div class="form-group">
                    <label for="task-description">
                        Description
                    </label>

                    <textarea
                        id="task-description"
                        name="description"
                        rows="3"
                        maxlength="500"
                        required
                    ></textarea>

                    <p
                        id="description-error"
                        class="field-error"
                        aria-live="polite"
                    ></p>
                </div>


                <div class="form-group">
                    <label for="task-status">
                        Status
                    </label>

                    <select
                        id="task-status"
                        name="status"
                    >
                        <option value="pending">
                            Pending
                        </option>

                        <option value="in-progress">
                            In Progress
                        </option>

                        <option value="completed">
                            Completed
                        </option>
                    </select>
                </div>


                <div class="form-group">
                    <label for="task-priority">
                        Priority
                    </label>

                    <select
                        id="task-priority"
                        name="priority"
                    >
                        <option value="low">
                            Low
                        </option>

                        <option
                            value="medium"
                            selected
                        >
                            Medium
                        </option>

                        <option value="high">
                            High
                        </option>
                    </select>
                </div>


                <div class="form-group">
                    <label for="task-due-date">
                        Due Date
                    </label>

                    <input
                        id="task-due-date"
                        name="dueDate"
                        type="date"
                    >
                </div>


                <div class="form-group">
                    <label for="task-tags">
                        Tags
                    </label>

                    <input
                        id="task-tags"
                        name="tags"
                        type="text"
                        placeholder="node, javascript, backend"
                        autocomplete="off"
                    >

                    <p class="form-help">
                        Separate multiple tags with commas.
                    </p>
                </div>


                <button type="submit">
                    Add Task
                </button>

                <p
                    id="form-error"
                    class="form-error"
                    aria-live="polite"
                ></p>

            </form>
        </section>


        <!-- Task List -->
        <section
            class="task-list-section"
            aria-labelledby="task-list-heading"
        >

            <div class="section-header">
                <h2 id="task-list-heading">
                    Task List
                </h2>

                <span id="visible-count">
                    0 tasks
                </span>
            </div>


            <div
                id="task-list"
                class="task-list"
                aria-live="polite"
            >
            </div>


            <p
                id="empty-state"
                class="empty-state"
                hidden
            >
                No tasks to display.
            </p>

        </section>
<div id="pagination-container" class="pagination-container">

    <button id="previous-page" type="button">
        Previous
    </button>

    <div id="page-numbers" class="page-numbers"></div>

    <button id="next-page" type="button">
        Next
    </button>

    <div class="control-group">
        <label for="page-limit">Tasks per page:</label>

        <select id="page-limit">
            <option value="5">5</option>
            <option value="10" selected>10</option>
            <option value="20">20</option>
            <option value="50">50</option>
        </select>
    </div>

</div>
    </main>

    <script
        type="module"
        src="js/app.js"
    ></script>

</body>

</html>
